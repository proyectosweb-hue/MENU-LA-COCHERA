<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Cochera · Menú</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="print-header">
        <button id="downloadBtn">⬇ Imprimir / Descargar</button>
    </div>

    <div class="menu">
        <div class="header">
            <img src="logo.png" alt="La Cochera" class="logo"
                 onload="this.classList.add('logo-ok'); document.getElementById('textLogo').style.display='none';"
                 onerror="this.style.display='none';">
            <div id="textLogo" class="text-logo">
                <div class="header-top">EST. LA COCHERA</div>
                <h1>LA COCHERA</h1>
            </div>
            <div class="header-bottom">COCINA · PARRILLA · BAR</div>
        </div>

        <div id="content" class="content">
            <!-- Generado por JavaScript -->
        </div>

        <div class="footer">
            Precios con ITBIS 18% incluido · RD$
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
