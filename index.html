<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Cochera · Menú</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="print-header">
        <button id="downloadBtn">⬇ Imprimir / Descargar (A4)</button>
    </div>

    <div class="frame">
        <div class="menu">
            <header class="header">
                <div class="masthead-top">
                    <span class="star">✦</span>
                    <span>Siempre Fresco</span>
                    <span class="star">✦</span>
                    <span>Sabor Dominicano</span>
                    <span class="star">✦</span>
                </div>
                <div class="header-center">
                    <span class="no25">N<sup>o</sup>25</span>
                    <img src="logo.png" alt="La Cochera" class="logo"
                         onload="this.classList.add('logo-ok'); var t=document.getElementById('textLogo'); if(t) t.style.display='none';"
                         onerror="this.style.display='none';">
                    <div id="textLogo" class="text-logo">
                        <h1>LA COCHERA</h1>
                    </div>
                    <div class="estd">Establecimiento N.º 25</div>
                    <div class="tagline">COCINA &nbsp;·&nbsp; PARRILLA &nbsp;·&nbsp; BAR</div>
                </div>
            </header>

            <div class="rule-double"></div>

            <div id="content" class="content">
                <!-- Generado por JavaScript -->
            </div>

            <footer class="footer">
                <div class="rule-double"></div>
                <p>Todos los precios incluyen ITBIS 18% &nbsp;•&nbsp; Valores en RD$</p>
                <p class="footer-sub">★ &nbsp; SIEMPRE FRESCO &nbsp; ★ &nbsp; SABOR DOMINICANO &nbsp; ★</p>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
