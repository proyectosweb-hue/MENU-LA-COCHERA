<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Cochera · Menú</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;0,900;1,500&family=Oswald:wght@300;400;500;600;700&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="print-header">
        <button id="downloadBtn">⬇ Imprimir / Descargar (A4)</button>
    </div>

    <div class="frame">
        <div class="menu">
            <header class="header">
                <div class="header-center">
                    <img src="logo.png" alt="La Cochera" class="logo"
                         onload="this.classList.add('logo-ok'); var t=document.getElementById('textLogo'); if(t) t.style.display='none';"
                         onerror="this.style.display='none';">
                    <div id="textLogo" class="text-logo">
                        <h1>LA COCHERA</h1>
                    </div>
                    <div class="estd">⬥ ESTABLECIMIENTO Nº 25 ⬥</div>
                    <div class="tagline">Cocina  ·  Parrilla  ·  Bar</div>
                </div>
            </header>

            <div id="content" class="content">
                <!-- Generado por JavaScript -->
            </div>

            <footer class="footer">
                <p>Todos los precios incluyen ITBIS 18% • Valores en RD$</p>
                <p class="footer-sub">★  SIEMPRE FRESCO  ·  SABOR DOMINICANO  ★</p>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
